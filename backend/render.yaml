services:
  - type: web
    name: fuel-on-go-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FAST2SMS_API_KEY
        sync: false
      - key: OTP_MODE
        value: dev
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
